name: Scansione giornaliera risparmi

on:
  schedule:
    - cron: "30 5 * * *"   # ogni giorno alle 06:30 ora solare / 07:30 ora legale (Roma)
  workflow_dispatch:        # avvio manuale dal tab "Actions"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scanner/scan.py
      - name: Salva dati aggiornati
        run: |
          git config user.name "risparmiocasa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dati del $(date +'%d/%m/%Y')"
          git pull --rebase || true
          git push
