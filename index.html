<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RisparmioCasa</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14211f;--mut:#5b6b68;--pri:#0f766e;--pri2:#ccfbf1;--bd:#e2e8e6;--warn:#b45309;--gold:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#16211f;--tx:#e6f0ee;--mut:#9fb2ae;--pri:#2dd4bf;--pri2:#134e4a;--bd:#24332f;--warn:#fbbf24;--gold:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:#0f766e;color:#fff;padding:14px 16px 10px}
header h1{margin:0;font-size:1.25rem}header small{opacity:.85}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;padding:10px 12px;border-radius:10px;border:0;font-size:1rem}
.search button{border:0;border-radius:10px;padding:0 14px;background:#fff;color:#0f766e;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:12px 12px 90px;max-width:820px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.meta{font-size:.78rem;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{background:var(--pri2);color:var(--tx);padding:2px 8px;border-radius:999px}
.new{background:var(--warn);color:#fff;padding:2px 8px;border-radius:999px}
.card h3{margin:8px 0 6px;font-size:1rem;line-height:1.35}
.card p{margin:0 0 10px;color:var(--mut);font-size:.88rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts a{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 10px;border-radius:9px;font-size:.85rem;text-decoration:none;cursor:pointer}
.acts .saved{background:var(--pri);color:#fff;border-color:var(--pri)}
textarea{width:100%;margin-top:8px;border:1px solid var(--bd);border-radius:9px;padding:8px;background:var(--bg);color:var(--tx);font:inherit}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0;font-size:.7rem;cursor:pointer;min-width:0}
nav button b{display:block;font-size:1.2rem}nav button.on{color:var(--pri);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.status{font-size:.8rem;color:var(--mut);margin:0 0 10px}
label.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.rank{display:flex;gap:12px;align-items:flex-start}
.pos{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;background:var(--pri2)}
.pos.p1{background:var(--gold);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:8px 0 10px}
.kpi div{background:var(--bg);border-radius:9px;padding:6px 8px;font-size:.75rem;color:var(--mut)}
.kpi b{display:block;font-size:1rem;color:var(--tx)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--card);color:var(--tx);padding:10px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style>
</head>

function toast(t,undo){const e=$("#toast");e.textContent=t;e.classList.add("show");e.style.pointerEvents=undo?"auto":"none";e.style.cursor=undo?"pointer":"default";
  e.onclick=undo?()=>{e.classList.remove("show");undoHide()}:null;clearTimeout(_tt);_tt=setTimeout(()=>{e.classList.remove("show");e.style.pointerEvents="none"},undo?5000:2200)}

async function loadFeed(){
  $("#sub").textContent="Aggiornamento in corso…";
  let ok=false;
  try{
    const r=await fetch(state.settings.feedUrl+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){const j=await r.json(); if(j.items){state.feed=j; ok=true}}
  }catch(e){}
  try{
    const r=await fetch("data/energia.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok){state.energia=await r.json();LS.set("rc_energia",state.energia)}
  }catch(e){}
  if(!ok){ ok = await liveScan(); }
  if(ok){LS.set("rc_feed",state.feed); checkNew();}
  $("#sub").textContent = state.feed.updated ? "Aggiornato: "+fmt(state.feed.updated) : "Nessun dato: controlla Opzioni";
  render();
}

async function liveScan(){
  const items=[]; const seen=new Set();
  if(!state.settings.proxy) return false;
  await Promise.all(Object.entries(LIVE_QUERIES).map(async([cat,q])=>{
    try{
      const u="https://news.google.com/rss/search?q="+encodeURIComponent(q+" when:2d")+"&hl=it&gl=IT&ceid=IT:it";
      const r=await fetch(state.settings.proxy+encodeURIComponent(u));
      const x=new DOMParser().parseFromString(await r.text(),"text/xml");
      [...x.querySelectorAll("item")].slice(0,8).forEach(it=>{
        let title=it.querySelector("title")?.textContent||""; const src=it.querySelector("source")?.textContent||"";
        if(src && title.endsWith(" - "+src)) title=title.slice(0,-(src.length+3));
        const key=title.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,80);
        if(!key||seen.has(key))return; seen.add(key);
        items.push({id:key.slice(0,24),title,link:it.querySelector("link")?.textContent||"",source:src,
          published:new Date(it.querySelector("pubDate")?.textContent||Date.now()).toISOString(),
          summary:"",category:cat,score:0,found:new Date().toISOString()});
      });
    }catch(e){}
  }));
  if(!items.length) return false;
  items.sort((a,b)=>b.published.localeCompare(a.published));
  state.feed={updated:new Date().toISOString(),categories:DEFAULT_CATS,items}; return true;
}

function checkNew(){
  const last=state.lastSeen; const nuove=visible(state.feed.items).filter(i=>!last||i.found>last);
  if(last && nuove.length && state.settings.notify && "Notification" in window && Notification.permission==="granted"){
    navigator.serviceWorker?.ready.then(reg=>reg.showNotification("RisparmioCasa",{
      body:nuove.length+" nuove opportunità di risparmio",icon:"icons/icon-192.png",tag:"rc-daily"}));
  }
}
function markSeen(){state.lastSeen=new Date().toISOString();LS.set("rc_lastSeen",state.lastSeen)}

const normT=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,80);
function isHidden(i){return !!(state.hidden[i.id]||state.hidden["t:"+normT(i.title)])}
function visible(list){return list.filter(i=>!isHidden(i))}
let _undo=null;
function hideItem(item){
  const now=new Date().toISOString();
  state.hidden[item.id]=now; const k=normT(item.title); if(k) state.hidden["t:"+k]=now;
  const wasSaved=state.saved.find(s=>s.id===item.id);
  if(wasSaved){state.saved=state.saved.filter(s=>s.id!==item.id);LS.set("rc_saved",state.saved)}
  pruneHidden(); LS.set("rc_hidden",state.hidden);
  _undo={item,wasSaved,k};
  render(); toast("🗑️ Notizia eliminata · tocca qui per annullare",true);
}
function undoHide(){
  if(!_undo)return; const {item,wasSaved,k}=_undo;
  delete state.hidden[item.id]; if(k) delete state.hidden["t:"+k];
  if(wasSaved){state.saved.unshift(wasSaved);LS.set("rc_saved",state.saved)}
  LS.set("rc_hidden",state.hidden); _undo=null; render(); toast("Ripristinata");
}
// mantiene la lista eliminate leggera: oltre 90 giorni le notizie non tornano comunque nel feed
function pruneHidden(){const lim=Date.now()-90*864e5;for(const[k,v]of Object.entries(state.hidden)){if(new Date(v).getTime()<lim)delete state.hidden[k]}}
function isSaved(id){return state.saved.some(s=>s.id===id)}
function toggleSave(item){
  if(isSaved(item.id)){state.saved=state.saved.filter(s=>s.id!==item.id);toast("Rimosso dall'archivio")}
  else{state.saved.unshift({...item,savedAt:new Date().toISOString(),note:""});toast("Salvato in archivio ⭐")}
  LS.set("rc_saved",state.saved); render();
}
async function share(item){
  const text=`💰 ${item.title}${item.source?" ("+item.source+")":""}`;
  if(navigator.share){try{await navigator.share({title:item.title,text,url:item.link});return}catch(e){if(e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(text+"\n"+item.link);toast("Link copiato negli appunti")}
  catch{window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+item.link),"_blank")}
}

function filtered(list){
  const q=state.q.trim().toLowerCase();
  return list.filter(i=>(state.cat==="tutte"||i.category===state.cat) &&
    (!q||(i.title+" "+(i.summary||"")+" "+(i.source||"")+" "+(i.note||"")).toLowerCase().includes(q)));
}
function card(i,inArchive){
  const c=cats()[i.category]||{label:i.category||"Altro",emoji:"•"};
  const isNew=state.lastSeen&&i.found>state.lastSeen&&!inArchive;
  return `<article class="card" data-id="${esc(i.id)}">
    <div class="meta"><span class="badge">${c.emoji} ${esc(c.label)}</span>${isNew?'<span class="new">NUOVO</span>':""}
      <span>${esc(i.source||"")}</span><span>${fmt(i.published)}</span></div>
    <h3>${esc(i.title)}</h3>${i.summary?`<p>${esc(i.summary)}</p>`:""}
    <div class="acts">
      <a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">🔗 Apri</a>
      <button type="button" data-a="save" class="${isSaved(i.id)?"saved":""}">${isSaved(i.id)?"★ Salvato":"☆ Salva"}</button>
      <button type="button" data-a="share">📤 Condividi</button>
      <button type="button" data-a="wa">💬 WhatsApp</button>
      <button type="button" data-a="del" aria-label="Elimina notizia">🗑️ Elimina</button>
    </div>
    ${inArchive?`<textarea data-a="note" rows="2" placeholder="Nota personale (es. scadenza, documenti da preparare)…">${esc(i.note||"")}</textarea>`:""}
  </article>`;
}

/* ---------- TARIFFE LUCE E GAS (Portale Offerte ARERA) ---------- */
function allItems(){return [...state.feed.items,...state.saved,...tariffaItems()]}
let _tItems=[];
function tariffaItems(){return _tItems}
function renderTariffe(){
  const e=state.energia, tipo=tState.tipo, isLuce=tipo==="luce", un=isLuce?"kWh":"Smc";
  const consumoRaw=isLuce?tState.kwh:tState.smc;
  let consumo=parseFloat(String(consumoRaw).replace(",","."));
  const valid=!isNaN(consumo)&&consumo>0&&consumo<=100000;
  if(!valid) consumo=isLuce?2700:1400;
  const d=e&&e[tipo];
  let body;
  if(!e){
    body=`<div class="card empty">Classifica non ancora disponibile.<br>Avvia la scansione da GitHub Actions oppure tocca ↻.</div>`;
  } else if(!d||!(d.candidati||d.top||[]).length){
    body=`<div class="card empty">Nessuna offerta disponibile oggi.<br><small>${esc(d&&d.errore||"")}</small></div>`;
  } else {
    const list=(d.candidati&&d.candidati.length?d.candidati:d.top).map(o=>({...o,stima:o.prezzo*consumo+o.fisso_anno}))
      .sort((a,b)=>a.stima-b.stima).slice(0,3);
    _tItems=list.map((o,i)=>({id:"t_"+tipo+"_"+(o.codice||o.offerta)+"_"+i,title:`${isLuce?"⚡":"🔥"} ${o.offerta} – ${o.fornitore}: ${o.prezzo.toFixed(4).replace(".",",")} €/${un} fisso`,
      link:safeUrl(o.url),source:"Portale Offerte ARERA",category:"energia",published:d.data_file||e.aggiornato,found:new Date().toISOString(),
      summary:`Quota fissa ${euro(o.fisso_anno)}/anno · stima parte fornitore ${euro(o.stima,0)}/anno per ${consumo} ${un}`}));
    const diff=list.length>1?list[list.length-1].stima-list[0].stima:0;
    body=list.map((o,i)=>`<article class="card" data-id="${esc(_tItems[i].id)}"><div class="rank">
      <div class="pos ${i===0?"p1":""}">${i+1}</div><div style="flex:1;min-width:0">
      <div class="meta"><span class="badge">🔒 Prezzo fisso${o.durata_mesi?" "+o.durata_mesi+" mesi":""}</span>${o.una_tantum>0?`<span class="badge">Una tantum ${euro(o.una_tantum)}</span>`:""}</div>
      <h3 style="margin-top:6px">${esc(o.fornitore)}</h3><p style="margin:0">${esc(o.offerta)}${o.codice?` · cod. ${esc(o.codice)}`:""}</p>
      <div class="kpi"><div>Prezzo ${isLuce?"energia":"gas"}<b>${o.prezzo.toFixed(4).replace(".",",")} €/${un}</b></div>
        <div>Quota fissa<b>${euro(o.fisso_anno)}/anno</b></div>
        <div>Spesa fornitore stimata<b>${euro(o.stima,0)}/anno</b></div></div>
      <div class="acts"><a href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">🔗 Vai all'offerta</a>
        <button type="button" data-a="save" class="${isSaved(_tItems[i].id)?"saved":""}">${isSaved(_tItems[i].id)?"★ Salvato":"☆ Salva"}</button>
        <button type="button" data-a="share">📤 Condividi</button><button type="button" data-a="wa">💬 WhatsApp</button></div>
      </div></div></article>`).join("")
      + `<p class="status">${diff>0?`Tra la 1ª e la 3ª offerta ci sono ${euro(diff,0)}/anno di differenza. `:""}Analizzate ${d.offerte_valide??"–"} offerte valide (file ARERA del ${d.data_file?new Date(d.data_file).toLocaleDateString("it-IT"):"–"}).</p>`;
  }
  $("#main").innerHTML=`<div class="seg" role="group" aria-label="Tipo fornitura">
      <button type="button" data-t="luce" class="${isLuce?"on":""}" aria-pressed="${isLuce}">⚡ Luce</button>
      <button type="button" data-t="gas" class="${!isLuce?"on":""}" aria-pressed="${!isLuce}">🔥 Gas</button></div>
    <div class="card"><label class="row" style="border:0">Il mio consumo annuo (${un})
      <input id="tCons" inputmode="decimal" value="${esc(consumoRaw)}" style="width:110px;padding:8px" aria-describedby="tHelp"></label>
      <p class="status" id="tHelp" style="margin:0">${valid?`Lo trovi in bolletta alla voce "consumo annuo". Classifica ricalcolata su ${consumo.toLocaleString("it-IT")} ${un}.`:`⚠️ Valore non valido: uso il profilo standard (${consumo} ${un}).`}</p></div>
    <p class="status"><b>Top 3 fornitori a prezzo fisso più basso</b> · clienti domestici, disponibili a Roma, senza condizioni limitanti · un'offerta per fornitore.</p>
    ${body}
    <div class="card"><p style="margin:0">ℹ️ La stima comprende solo la parte del fornitore (prezzo dell'energia × consumo + quota fissa di vendita). Rete, oneri e imposte sono uguali per tutti e non cambiano la classifica. Prima di firmare controlla la <b>scheda sintetica</b> e verifica sul
    <a href="${PORTALE}" target="_blank" rel="noopener" style="color:var(--pri)">Portale Offerte ARERA ↗</a>.</p></div>`;
}

/* ---------- FONTI ---------- */
function daysTo(d){return Math.ceil((new Date(d+"T23:59:59")-new Date())/864e5)}
function renderFonti(){
  const my=parseFloat(String(fState.isee).replace(/\./g,"").replace(",","."));
  const hasIsee=!isNaN(my)&&my>=0;
  const okIsee=s=>!hasIsee||s.isee==null||my<=s.isee;
  const okArea=s=>fState.area==="Tutte"||s.area===fState.area;
  const okStato=s=>fState.stato==="tutti"||s.stato===fState.stato;
  const cntArea=a=>SOURCES.filter(s=>okIsee(s)&&okStato(s)&&(a==="Tutte"||s.area===a)).length;
  const cntStato=st=>SOURCES.filter(s=>okIsee(s)&&okArea(s)&&(st==="tutti"||s.stato===st)).length;
  let list=SOURCES.filter(s=>okIsee(s)&&okArea(s)&&okStato(s));
  const active=fState.area!=="Tutte"||fState.stato!=="tutti"||hasIsee;
  const rank=s=>{ if(s.scad&&daysTo(s.scad)>=0&&s.stato!=="chiuso") return daysTo(s.scad);
    return {aperto:5000,attesa:6000,chiuso:6500,automatico:7000,permanente:8000}[s.stato]||9000; };
  if(fState.sort==="scadenza") list.sort((a,b)=>rank(a)-rank(b)||(a.isee??1e9)-(b.isee??1e9));
  else if(fState.sort==="isee") list.sort((a,b)=>(a.isee??1e9)-(b.isee??1e9));
  else list.sort((a,b)=>a.ente.localeCompare(b.ente)||a.area.localeCompare(b.area));
  const scard=s=>{
    const st=STATO[s.stato]||["",""];
    let sc="";
    if(s.scad){const d=daysTo(s.scad);const dt=new Date(s.scad).toLocaleDateString("it-IT");
      sc=d<0?`<span class="badge">⌛ scaduto ${dt}</span>`:`<span class="${d<=60?"new":"badge"}">⏰ ${dt} · ${d} gg</span>`;}
    const is=s.isee==null?`<span class="badge">Nessun limite ISEE</span>`:`<span class="badge">ISEE ≤ ${euro(s.isee,0)}</span>`;
    return `<article class="card"><div class="meta"><span class="badge">${st[0]} ${st[1]}</span>${sc}${is}<span>${esc(s.ente)} · ${esc(s.area)}</span></div>
      <h3><a href="${s.u}" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:none">${esc(s.t)} ↗</a></h3>${s.nota?`<p>${esc(s.nota)}</p>`:""}
      <div class="acts"><button type="button" data-fs="${esc(s.u)}">📤 Condividi</button></div></article>`;
  };
  $("#main").innerHTML=`<div class="card">
    <label class="row">Il mio ISEE (€)<input id="fIsee" inputmode="decimal" placeholder="es. 18000" value="${esc(fState.isee)}" style="width:130px;padding:8px"></label>
    <label class="row">Ordina per<select id="fSort" style="padding:8px">
      <option value="scadenza"${fState.sort==="scadenza"?" selected":""}>Scadenza più vicina</option>
      <option value="isee"${fState.sort==="isee"?" selected":""}>Soglia ISEE crescente</option>
      <option value="ente"${fState.sort==="ente"?" selected":""}>Ente (Roma / Lazio / Governo)</option></select></label>
    <p class="status" style="margin:12px 0 0"><b>Categoria</b></p>
    <div class="chips" style="padding:6px 0 0;border:0" role="group" aria-label="Filtra per categoria">${AREE.map(a=>`<button type="button" class="chip ${fState.area===a?"on":""}" data-fa="${a}" aria-pressed="${fState.area===a}">${AREA_EMOJI[a]} ${a} (${cntArea(a)})</button>`).join("")}</div>
    <p class="status" style="margin:12px 0 0"><b>Stato della domanda</b></p>
    <div class="chips" style="padding:6px 0 0;border:0" role="group" aria-label="Filtra per stato">${STATI.map(st=>{const lb=st==="tutti"?["✨","Tutti"]:STATO[st];return `<button type="button" class="chip ${fState.stato===st?"on":""}" data-fst="${st}" aria-pressed="${fState.stato===st}">${lb[0]} ${lb[1]} (${cntStato(st)})</button>`}).join("")}</div>
    ${active?`<button type="button" class="btn" id="fReset" style="margin-top:10px">✖ Azzera filtri</button>`:""}
    <p class="status" style="margin-top:8px">${list.length} fonti${hasIsee?" compatibili con il tuo ISEE":""} · verificate il 13/11/2026. Controlla sempre la pagina ufficiale prima di fare domanda.</p></div>`
    + (list.length?list.map(scard).join(""):`<div class="empty">Nessuna fonte per questi filtri.</div>`);
}

/* ---------- RENDER ---------- */
function renderChips(){
  const hide=["fonti","impostazioni","tariffe"].includes(state.view);
  $("#chips").style.display=hide?"none":"flex";
  $(".search").style.display=hide?"none":"flex";
  if(hide) return;
  const all=[["tutte",{label:"Tutte",emoji:"✨"}],...Object.entries(cats())];
  $("#chips").innerHTML=all.map(([k,c])=>`<button type="button" class="chip ${state.cat===k?"on":""}" data-c="${k}">${c.emoji} ${esc(c.label)}</button>`).join("");
}
function render(){
  renderChips(); const m=$("#main");
  if(state.view==="fonti"){ renderFonti(); return; }
  if(state.view==="tariffe"){ renderTariffe(); return; }
  if(state.view==="impostazioni"){
    const s=state.settings;
    m.innerHTML=`<div class="card">
      <label class="row">Notifiche quando apri l'app e ci sono novità<input type="checkbox" id="notif" ${s.notify?"checked":""}></label>
      <p class="status">Per le notifiche giornaliere anche ad app chiusa usa <b>ntfy</b> o <b>Telegram</b> (vedi README).</p>
      <label class="row" style="display:block">URL del feed giornaliero<input id="feedUrl" value="${esc(s.feedUrl)}" style="width:100%;margin-top:6px;padding:8px"></label>
      <label class="row" style="display:block">Proxy per modalità diretta<input id="proxy" value="${esc(s.proxy)}" style="width:100%;margin-top:6px;padding:8px"></label>
      <button class="btn" type="button" id="saveSet">Salva impostazioni</button>
      <button class="btn" type="button" id="exp">⬇️ Esporta archivio</button>
      <button class="btn" type="button" id="imp">⬆️ Importa archivio</button>
      <input type="file" id="impFile" accept="application/json" hidden>
      <p class="status" style="margin-top:12px">Archivio: ${state.saved.length} elementi salvati · Feed: ${visible(state.feed.items).length} notizie · Eliminate: ${state.feed.items.filter(isHidden).length}</p>
      <button class="btn" type="button" id="unhide">♻️ Ripristina notizie eliminate</button></div>`;
    return;
  }
  let list;
  if(state.view==="archivio") list=state.saved;
  else if(state.view==="oggi"){
    const lim=Date.now()-36*3600e3;
    list=visible(state.feed.items).filter(i=>new Date(i.found).getTime()>lim||new Date(i.published).getTime()>lim)
      .sort((a,b)=>(b.score||0)-(a.score||0));
  } else list=visible(state.feed.items);
  list=filtered(list);
  const head=state.view==="archivio"?`<p class="status">⭐ ${list.length} opportunità salvate</p>`:`<p class="status">${list.length} opportunità${state.view==="oggi"?" delle ultime 36 ore, ordinate per rilevanza":""}</p>`;
  m.innerHTML=head+(list.length?list.map(i=>card(i,state.view==="archivio")).join(""):
    `<div class="empty">${state.view==="archivio"?"Nessun elemento salvato.<br>Tocca ☆ Salva su una notizia.":"Nessuna opportunità trovata.<br>Tocca ↻ per aggiornare."}</div>`);
}

/* ---------- EVENTI ---------- */
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(state.view==="oggi"||state.view==="tutte") markSeen();
  state.view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render();window.scrollTo(0,0);
});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){state.cat=b.dataset.c;render()}});
$("#sf").addEventListener("submit",e=>e.preventDefault());
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#refresh").addEventListener("click",loadFeed);

$("#main").addEventListener("click",async e=>{
  const t=e.target;
  const seg=t.closest("[data-t]"); if(seg){tState.tipo=seg.dataset.t;LS.set("rc_tariffe",tState);renderTariffe();return;}
  const fa=t.closest("[data-fa]"); if(fa){fState.area=fa.dataset.fa;LS.set("rc_fonti",fState);renderFonti();return;}
  const fst=t.closest("[data-fst]"); if(fst){fState.stato=fst.dataset.fst;LS.set("rc_fonti",fState);renderFonti();return;}
  if(t.id==="fReset"){Object.assign(fState,{area:"Tutte",stato:"tutti",isee:""});LS.set("rc_fonti",fState);renderFonti();return;}
  const fs=t.closest("[data-fs]"); if(fs){const src=SOURCES.find(x=>x.u===fs.dataset.fs);if(src)share({title:src.t,link:src.u,source:src.ente});return;}
  const b=t.closest("button[data-a]");
  if(b){
    const id=b.closest(".card").dataset.id;
    const item=allItems().find(i=>i.id===id);if(!item)return;
    if(b.dataset.a==="save")toggleSave(item);
    if(b.dataset.a==="share")share(item);
    if(b.dataset.a==="del"){hideItem(item);return;}
    if(b.dataset.a==="wa")window.open("https://wa.me/?text="+encodeURIComponent("💰 "+item.title+"\n"+item.link),"_blank");
    return;
  }
  if(t.id==="saveSet"){
    state.settings.feedUrl=$("#feedUrl").value.trim()||"data/feed.json";
    state.settings.proxy=$("#proxy").value.trim();
    state.settings.notify=$("#notif").checked;
    if(state.settings.notify&&"Notification"in window){
      const p=await Notification.requestPermission(); if(p!=="granted"){state.settings.notify=false;toast("Permesso notifiche negato")}
      else{try{const reg=await navigator.serviceWorker.ready;
        if("periodicSync"in reg) await reg.periodicSync.register("rc-daily",{minInterval:24*3600e3});}catch(err){}}
    }
    LS.set("rc_settings",state.settings);toast("Impostazioni salvate");render();
  }
  if(t.id==="exp"){
    const blob=new Blob([JSON.stringify(state.saved,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="archivio-risparmiocasa.json";a.click();
  }
  if(t.id==="imp")$("#impFile").click();
  if(t.id==="unhide"){if(confirm("Ripristinare tutte le notizie eliminate?")){state.hidden={};LS.set("rc_hidden",state.hidden);toast("Notizie ripristinate");render();}}
});
let _deb;
function refocus(id){const i=$("#"+id);if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n)}catch{}}}
$("#main").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.a==="note"){
    const id=t.closest(".card").dataset.id;const s=state.saved.find(x=>x.id===id);
    if(s){s.note=t.value;LS.set("rc_saved",state.saved)}
  }
  if(t.id==="fIsee"){fState.isee=t.value;LS.set("rc_fonti",fState);clearTimeout(_deb);_deb=setTimeout(()=>{renderFonti();refocus("fIsee")},600);}
  if(t.id==="tCons"){tState[tState.tipo==="luce"?"kwh":"smc"]=t.value;LS.set("rc_tariffe",tState);clearTimeout(_deb);_deb=setTimeout(()=>{renderTariffe();refocus("tCons")},600);}
});
$("#main").addEventListener("change",async e=>{
  if(e.target.id==="fSort"){fState.sort=e.target.value;LS.set("rc_fonti",fState);renderFonti();return;}
  if(e.target.id!=="impFile"||!e.target.files[0])return;
  try{const arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr))throw 0;
    const ids=new Set(state.saved.map(s=>s.id));arr.forEach(x=>{if(x&&x.id&&!ids.has(x.id))state.saved.push(x)});
    LS.set("rc_saved",state.saved);toast("Archivio importato");render();}
  catch{toast("File non valido")}
});

if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js");
render(); loadFeed();
</script>
</body>
</html>
